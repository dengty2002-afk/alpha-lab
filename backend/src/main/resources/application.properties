spring.application.name=quant-platform
server.address=127.0.0.1
server.port=${QUANT_PORT:8080}
server.error.include-message=never
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
spring.mvc.async.request-timeout=0
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.web.resources.cache.period=0
spring.jackson.serialization.indent-output=false
quant.project-dir=${QUANT_PROJECT_DIR:}
quant.workspace-dir=${QUANT_WORKSPACE_DIR:}
quant.worker-python=${QUANT_PYTHON:}
quant.worker-timeout-seconds=${QUANT_WORKER_TIMEOUT:3600}
logging.level.local.quant=INFO
